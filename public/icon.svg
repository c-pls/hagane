<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark Steel Squircle Gradient -->
    <linearGradient id="cardDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="45%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>

    <!-- Forged Steel Blade Gradient (Bright Outer Light Edge) -->
    <linearGradient id="steelLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Forged Steel Blade Gradient (Inner Spine Facet) -->
    <linearGradient id="steelDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Electric Cyan / Blue Steel Knurled Barbell -->
    <linearGradient id="blueBar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <filter id="iconGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base Icon Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#cardDark)" stroke="#334155" stroke-width="5" filter="url(#iconGlow)"/>
  <!-- Subtle Inset Ring -->
  <rect x="44" y="44" width="424" height="424" rx="84" fill="none" stroke="#1e293b" stroke-width="3"/>

  <!-- Center Knurled Barbell Crossbar -->
  <rect x="144" y="226" width="224" height="60" rx="8" fill="url(#blueBar)"/>
  <!-- Knurling Grip Cuts -->
  <line x1="214" y1="226" x2="214" y2="286" stroke="#090d16" stroke-width="5" opacity="0.4"/>
  <line x1="242" y1="226" x2="242" y2="286" stroke="#090d16" stroke-width="5" opacity="0.4"/>
  <line x1="270" y1="226" x2="270" y2="286" stroke="#090d16" stroke-width="5" opacity="0.4"/>
  <line x1="298" y1="226" x2="298" y2="286" stroke="#090d16" stroke-width="5" opacity="0.4"/>

  <!-- Left Katana Blade Pillar (Twin-Facet 3D Steel) -->
  <!-- Outer Cutting Edge (Light Steel) -->
  <polygon points="98,124 144,78 144,434 98,388" fill="url(#steelLight)"/>
  <!-- Inner Spine Facet (Shadow Steel) -->
  <polygon points="144,78 174,108 174,404 144,434" fill="url(#steelDark)"/>

  <!-- Right Katana Blade Pillar (Twin-Facet 3D Steel) -->
  <!-- Inner Spine Facet (Shadow Steel) -->
  <polygon points="368,78 338,108 338,404 368,434" fill="url(#steelDark)"/>
  <!-- Outer Cutting Edge (Light Steel) -->
  <polygon points="414,124 368,78 368,434 414,388" fill="url(#steelLight)"/>
</svg>
