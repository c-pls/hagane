apply plugin: 'com.android.application'

// Release signing inputs come from environment variables (CI) or android/keystore.properties
// (local, git-ignored). There are intentionally no default passwords in this file.
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file("keystore.properties")
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def signingValue = { String envName, String propName ->
    def v = System.getenv(envName) ?: keystoreProps.getProperty(propName)
    return (v != null && !v.trim().isEmpty()) ? v : null
}
def releaseKeystoreFile = file(signingValue("RELEASE_KEYSTORE_PATH", "storeFile") ?: "hagane.keystore")
def releaseStorePassword = signingValue("RELEASE_KEYSTORE_PASSWORD", "storePassword") ?: System.getenv("RELEASE_STORE_PASSWORD")
def releaseKeyPassword = signingValue("RELEASE_KEY_PASSWORD", "keyPassword")
def releaseKeyAlias = signingValue("RELEASE_KEY_ALIAS", "keyAlias")
def releaseSigningMissing = []
if (!releaseKeystoreFile.exists()) releaseSigningMissing.add("keystore file (" + releaseKeystoreFile.absolutePath + ")")
if (!releaseStorePassword) releaseSigningMissing.add("RELEASE_KEYSTORE_PASSWORD")
if (!releaseKeyPassword) releaseSigningMissing.add("RELEASE_KEY_PASSWORD")
if (!releaseKeyAlias) releaseSigningMissing.add("RELEASE_KEY_ALIAS")
def releaseSigningReady = releaseSigningMissing.isEmpty()

android {
    namespace = "com.hagane.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.hagane.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode (System.getenv("GITHUB_RUN_NUMBER") ? Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER")) + 9 : 9)
        versionName (System.getenv("GITHUB_RUN_NUMBER") ? "1.4.${System.getenv('GITHUB_RUN_NUMBER')}" : "1.4.0")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        debug {
            // Default Android debug keystore
        }
        release {
            if (releaseSigningReady) {
                storeFile releaseKeystoreFile
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

// Fail only when a release artifact is actually requested, so debug builds and `cap sync`
// keep working without release credentials.
gradle.taskGraph.whenReady { graph ->
    if (!releaseSigningReady && graph.allTasks.any { it.name.toLowerCase().contains("release") }) {
        throw new GradleException(
            "Release signing is not configured. Missing: " + releaseSigningMissing.join(", ") + ". " +
            "Set the RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_PASSWORD and RELEASE_KEY_ALIAS environment variables " +
            "(or add them to android/keystore.properties as storePassword, keyPassword, keyAlias), " +
            "and provide the keystore file (default android/app/hagane.keystore, override with RELEASE_KEYSTORE_PATH)."
        )
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    implementation 'com.garmin.connectiq:ciq-companion-app-sdk:2.4.0'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
