name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Shaken Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Node Dependencies
        run: |
          npm ci

      - name: Build Web Application
        run: |
          npm run build

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Set Gradle Permissions
        run: |
          chmod +x android/gradlew

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare APK Artifact
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/release/app-release.apk release-output/shaken.apk
          ls -lh release-output/shaken.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shaken-apk
          path: release-output/shaken.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.${{ github.run_number }}
          name: "Shaken v1.2.${{ github.run_number }}"
          make_latest: true
          generate_release_notes: true
          body: |
            ## 🏋️ Shaken - Offline Gym Companion APK

            Download and install the APK directly on your Samsung Galaxy or Android phone:
            👉 **[Download shaken.apk](https://github.com/${{ github.repository }}/releases/download/v1.2.${{ github.run_number }}/shaken.apk)**

            ---
            ### ✨ Features in this release:
            - **Compact Hevy-Style Exercise Picker**: Search bar right at the top bar, displaying 7–8 exercises above the phone keyboard, with `Most used` / `All exercises` tabs and circular `(?)` preview buttons.
            - **Intelligent Relevance Ranking**: Instant high-priority ranking for exact title matches (e.g. *Machine Standing Calf Raise*).
            - **Inspect Wiki & Return to Search**: Tap `(?)` on any exercise to watch continuous 1080p video demo and cues, and return back with your search query fully preserved.
            - **Warm-up Exercises & Sets**: Dedicated Warm-up section with light-weight sets + 'W' warm-up set tags for main compound movements.
            - **Native Smartphone Gestures**: Edge swipe-to-go-back, hardware back button exit protection, and edge-to-edge immersive status bar.
            - **199 Offline Exercises**: Full 1080p 30-FPS male demo videos bundled directly in the app.
            - **1-Click Language Switcher**: Tap `🇺🇸 EN` or `🇻🇳 VI` in the header for instant switching.
            - **Pure Vietnamese Translations**: 1-to-1 instructions with natural Vietnamese gym terminology.
            - **Custom Workout Routines**: Drag-and-drop (`⋮⋮`) to reorder exercises, track sets, weight (kg), and reps.
            - **Read-Only & Edit Mode**: Clean workout viewing by default, quick editing toggle.
            - **Offline & Backup**: 100% offline functionality with persistent device storage.

            ---
            ### 📱 How to install on your Samsung Galaxy (Android):
            1. Tap the download link above in Samsung Internet or Chrome on your phone.
            2. Tap the downloaded file `shaken.apk`.
            3. Tap **Install** / **Update**.
            4. Open **Shaken** and enjoy your workouts!
          files: release-output/shaken.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Job Summary
        run: |
          echo "### 🏋️ Shaken Android APK Built Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The official Android APK for **Shaken** has been built, signed, uploaded as an artifact, and published to GitHub Releases." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### How to install on your Samsung Galaxy (Android):" >> $GITHUB_STEP_SUMMARY
          echo "1. Go to the **Releases** tab on your GitHub repository (or download from the release link above)." >> $GITHUB_STEP_SUMMARY
          echo "2. Tap \`shaken.apk\` to download and install directly on your phone." >> $GITHUB_STEP_SUMMARY
