name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Shaken Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Node Dependencies
        run: |
          npm ci || npm install

      - name: Build Web Application
        run: |
          npm run build

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Set up Gradle Permissions
        run: |
          chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Artifact
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/shaken-debug.apk
          ls -lh release-output/shaken-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shaken-debug-apk
          path: release-output/shaken-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Job Summary
        run: |
          echo "### 🏋️ Shaken Android APK Built Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The offline Android APK for **Shaken** has been built and uploaded as a GitHub Action artifact." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### How to install on your Samsung Galaxy (Android):" >> $GITHUB_STEP_SUMMARY
          echo "1. Go to the **Actions** tab on your GitHub repository." >> $GITHUB_STEP_SUMMARY
          echo "2. Open this workflow run and download the **shaken-debug-apk** artifact zip." >> $GITHUB_STEP_SUMMARY
          echo "3. Extract \`shaken-debug.apk\` and transfer it to your phone (via USB, Quick Share, Google Drive, or download directly in mobile Chrome)." >> $GITHUB_STEP_SUMMARY
          echo "4. Tap \`shaken-debug.apk\` to install (allow 'Install unknown apps' if prompted)." >> $GITHUB_STEP_SUMMARY
          echo "5. Open **Shaken** — enjoy 100% offline access to all 179 video exercises and custom workout routines!" >> $GITHUB_STEP_SUMMARY
